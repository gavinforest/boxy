global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Per-container CPU/memory/network/disk. cAdvisor reads the cgroup
  # hierarchy directly, so it sees every boxy instance without any agent
  # inside the box.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Whole-host metrics — the number that actually matters on a VPS running
  # several boxes is how much headroom is left.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
